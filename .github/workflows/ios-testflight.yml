name: iOS TestFlight

# Manual only. macOS minutes cost money. Bundle ID registered 15 Nov 2026.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight (turn off to only archive and export)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.1"
  BUNDLE_ID: com.novaralabs.longnote

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Mask secrets
        working-directory: .
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
        run: |
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$ISSUER"
          if [ -n "$AMPLITUDE_API_KEY" ]; then echo "::add-mask::$AMPLITUDE_API_KEY"; fi
          if [ -n "$META_CLIENT_TOKEN" ]; then echo "::add-mask::$META_CLIENT_TOKEN"; fi

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write secrets to disk
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter config and pod install
        # Backend URL + anon key: committed defaults in
        # lib/core/cloud/backend_config.dart (public by design). Optional
        # repo variables SUPABASE_URL / SUPABASE_ANON_KEY override them; the
        # dart-defines are written into Generated.xcconfig, which the archive
        # step below uses.
        #
        # Analytics (docs/ANALYTICS.md): secrets AMPLITUDE_API_KEY (dart-define)
        # and META_APP_ID + META_CLIENT_TOKEN (written into Info.plist here,
        # plus the META_APP_ID dart-define that switches Meta on in Dart).
        # These ship inside the app and are not secret; they are kept out of
        # the public repo and out of the logs. Missing = that SDK stays off.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
        run: |
          set -eu
          BUILD_NUMBER=$(( ${{ github.run_number }} + 100 ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          DEFINES=()
          if [ -n "${SUPABASE_URL}" ]; then DEFINES+=(--dart-define=SUPABASE_URL="${SUPABASE_URL}"); fi
          if [ -n "${SUPABASE_ANON_KEY}" ]; then DEFINES+=(--dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}"); fi
          if [ -n "${AMPLITUDE_API_KEY}" ]; then DEFINES+=(--dart-define=AMPLITUDE_API_KEY="${AMPLITUDE_API_KEY}"); fi
          if [ -n "${META_APP_ID}" ] || [ -n "${META_CLIENT_TOKEN}" ]; then
            # Both or neither: initializing the Meta SDK without an app id
            # in Info.plist would crash the app.
            if [ -z "${META_APP_ID}" ] || [ -z "${META_CLIENT_TOKEN}" ]; then
              echo "META_APP_ID and META_CLIENT_TOKEN must both be set" >&2; exit 1
            fi
            PLIST=ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Delete :FacebookAppID" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :FacebookClientToken" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :FacebookAppID string ${META_APP_ID}" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :FacebookClientToken string ${META_CLIENT_TOKEN}" "$PLIST"
            DEFINES+=(--dart-define=META_APP_ID="${META_APP_ID}")
            echo "Meta App Events: on"
          else
            echo "Meta App Events: off (no META_APP_ID secret)"
          fi
          flutter build ios --config-only --release --no-codesign \
            --build-number "$BUILD_NUMBER" ${DEFINES[@]+"${DEFINES[@]}"}
          (cd ios && pod install)

      - name: Archive (automatic signing with API key)
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            | tail -n 200

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eu
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Delete secrets from the runner
        if: always()
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
                "$RUNNER_TEMP/ExportOptions.plist"
